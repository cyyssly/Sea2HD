# 大航海时代2 —— 高清渲染配置（DOSBox Staging 0.83）
# 由 hd\dosbox-staging\dosbox.exe --conf sea2-hd.conf 加载
# 原始 dosbox.conf / sea2-win.conf 保持不动，可随时退回旧版

[sdl]
# shader 只在 opengl 后端生效；texturenb 排除 shader 干扰
output = texturenb
fullscreen = off
fullscreen_mode = standard
# 系统开了 150% DPI 缩放，固定 1280x960 会被放大到 1920x1440，超出屏幕。
# 用 default 让 Staging 按桌面实际尺寸自动决定；也可改 large，或改回 1280x960（仅适合 100% 缩放时）
window_size = default
vsync = off
presentation_mode = auto

[render]
# 4 倍 HQX 高清合成开关
sea2_hd = on
sea2_hd_path = ../assets/hd
# 320x200 按 4:3 还原（VGA 时代显示器就是被纵向拉伸的）
aspect = auto
# sharp：把像素当作小矩形放大，清晰且不糊；想切换 CRT 风格改为 crt-auto
shader = sharp
# off：铺满窗口；CRT 着色器建议改为 auto，避免扫描线不均
integer_scaling = off
viewport = fit
# 关闭 CRT 色彩/扫描线调整，保持 HQX PNG 原始颜色
image_adjustments = off

[dosbox]
memsize = 16

[cpu]
core = normal
cpu_cycles = 10500
cpu_throttle = off

[dos]
xms = on
ems = on
umb = on

# 想切换 CRT 显像管风格：shader = crt-auto，integer_scaling = auto
# 想强制填满 1080p 全屏并保留扫描线，可改用：
# shader = crt/vga-1080p-fake-double-scan

[autoexec]
mount c ..\sea2
c:
play
