[sdl]
output = texturenb
fullscreen = off
window_size = default
vsync = off

[render]
sea2_hd = on
sea2_hd_path = ../assets/hd
aspect = auto
shader = sharp
integer_scaling = off
viewport = fit
image_adjustments = off

[dosbox]
memsize = 16

[cpu]
core = normal
cpu_cycles = 10500
cpu_throttle = off

[dos]
xms = on
ems = on
umb = on

[autoexec]
mount c runtime-game
c:
play
